<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0ea5e9" />
  <title>登录 - 羽毛球馆管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="login-page">
    <div class="login-header">
      <div class="login-logo">🏸</div>
      <h1>羽毛球馆管理系统</h1>
      <p>管理人员登录</p>
    </div>

    <form class="login-card" id="login-form">
      <label>
        管理账号
        <input type="text" id="username" autocomplete="username" placeholder="请输入账号" required />
      </label>
      <label>
        登录密码
        <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码" required />
      </label>
      <p class="login-error hidden" id="login-error"></p>
      <button type="submit" class="btn btn-primary login-submit" id="login-btn">登 录</button>
    </form>

    <div class="login-tip">
      <p>默认账号：admin / admin123</p>
      <p>前台账号：manager / wt2024</p>
      <p class="login-tip-note">正式部署前请在 server/config.js 修改密码</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    async function detectServerMode() {
      try {
        const res = await fetch('/api/session', { credentials: 'include' });
        if (res.ok || res.status === 401) return 'server';
      } catch (_) {}
      return 'static';
    }

    async function checkSession() {
      const mode = await detectServerMode();
      if (mode !== 'server') {
        document.getElementById('login-error').textContent =
          '请通过 npm start 启动服务器后访问，不要直接打开 HTML 文件';
        document.getElementById('login-error').classList.remove('hidden');
        return;
      }
      try {
        const res = await fetch('/api/session', { credentials: 'include' });
        if (res.ok) window.location.href = '/index.html';
      } catch (_) {}
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = '/index.html';
          return;
        }
        errorEl.textContent = data.msg || '登录失败';
        errorEl.classList.remove('hidden');
      } catch {
        errorEl.textContent = '无法连接服务器，请确认已运行 npm start';
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });

    checkSession();
  </script>
</body>
</html>
